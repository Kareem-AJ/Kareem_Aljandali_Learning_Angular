<div *ngIf="soccerTeam">
  <h1 style="border: 2px black solid">{{soccerTeam.name | favTeam}}</h1>
  <h2>{{soccerTeam.league | lowercase}}</h2>
  <h3>{{soccerTeam.bestPlayer | titlecase}}</h3>
  <h4>{{soccerTeam.winsChampionship}}</h4>
  <img [ngSrc]="soccerTeam.image" alt="" width="300px" height="300px">
</div>
