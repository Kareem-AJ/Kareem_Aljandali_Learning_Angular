<form [formGroup]="soccerTeamsForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id" />
  </div>
  <div class="form-group">
    <label for="name">Name</label>
    <input type="text" id="name" formControlName="name" />
  </div>
  <div class="form-group">
    <label for="league">League</label>
    <input type="text" id="league" formControlName="league" />
  </div>
  <div class="form-group">
    <label for="bestPlayer">bestPlayer</label>
    <input type="text" id="bestPlayer" formControlName="bestPlayer" />
  </div>
  <div class="form-group">
    <p>Did the team won the champion league</p>
    <input type="radio" id="true" value="true" formControlName="winsChampionship" />
    <label for="true">ture</label>
    <input type="radio" id="false" value="false" formControlName="winsChampionship" />
    <label for="false">false</label>
  </div>
  <div class="form-group">
    <label for="image">image</label>
    <input type="file" id="image" formControlName="image" name="image" />
  </div>
  <div *ngIf="error" class="error">{{ error }}</div>

</form>
